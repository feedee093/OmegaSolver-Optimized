name: Build Windows EXE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve verified source
        shell: pwsh
        run: ./scripts/import-upstream.ps1
      - name: Apply community patch
        run: python scripts/apply-community-patch.py upstream/OmegaSolver-5.0.0-source
      - name: Build independent preview
        run: dotnet build src/Preview/Preview.csproj -c Release
      - name: Publish portable Windows x64 EXE
        shell: pwsh
        run: |
          dotnet publish upstream/OmegaSolver-5.0.0-source/OmegaSolver.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o dist
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
          if (!(Test-Path dist/OmegaSolver.exe)) { throw 'Executable missing' }
          New-Item -ItemType Directory -Path artifact -Force | Out-Null
          Copy-Item dist/OmegaSolver.exe artifact/OmegaSolver.exe
          $hash = (Get-FileHash artifact/OmegaSolver.exe -Algorithm SHA256).Hash
          "$hash  OmegaSolver.exe" | Set-Content artifact/SHA256SUMS.txt
          'Experimental unsigned community build; not tested for destructive operations.' | Set-Content artifact/NOTICE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OmegaSolver-Optimized-win-x64
          path: artifact/
          if-no-files-found: error
          retention-days: 30
